      `<div class="blocks">` + sec(`Marcador: ${ok} encerts de ${n} respostes`, `<p>${n === QUIZ.length ? (ok >= QUIZ.length * .8 ? "Molt bé: domines el temari." : "Repassa els temes enllaçats a les preguntes fallades i torna-ho a provar.") : "Respon totes les preguntes per veure el resultat final."}</p>${n ? `<button type="button" class="btn" id="qz-reset">Torna a començar</button>` : ""}`) +
      QUIZ.map(([q, o, c, e, t], i) => { const a = quizAns[i], r = a !== undefined, tema = TEMAS.find(x => x.id === t);
        return `<section class="b qz" style="${tema ? sty(tema.m) : ""}"><h3>${i + 1}. ${esc(q)}</h3><div class="qo">${o.map((x, j) => `<button type="button" class="opt${r && j === c ? " good" : ""}${r && j === a && a !== c ? " bad" : ""}" data-q="${i}" data-o="${j}" ${r ? "disabled" : ""}>${esc(x)}</button>`).join("")}</div>${r ? `<p class="fbk" role="status"><b>${a === c ? "Correcte." : "No és correcte."}</b> ${esc(e)} ${tema ? `<button type="button" class="lnk" data-go="${t}">Repassa: ${esc(tema.t)}</button>` : ""}</p>` : ""}</section>`; }).join("") + `</div>`;
  },
  glossari: () => {
    const l = TEMAS.flatMap(t => (t.k || []).map(([a, b]) => ({a, b, tema: t.t}))).sort((x, y) => x.a.localeCompare(y.a, "ca"));
    const L = [...new Set(l.map(c => c.a[0].toUpperCase()))];
    return thead("Referència", "Glossari", "Tots els conceptes clau del temari, per ordre alfabètic.") +
      `<nav class="az" aria-label="Lletres">${L.map(x => `<a href="#g-${x}" data-letter="${x}">${x}</a>`).join("")}</nav><div class="b"><dl>` +
      l.map((c, i) => `<dt${i === 0 || l[i - 1].a[0].toUpperCase() !== c.a[0].toUpperCase() ? ` id="g-${c.a[0].toUpperCase()}"` : ""}>${esc(c.a)}</dt><dd>${esc(c.b)} <small>(${esc(c.tema)})</small></dd>`).join("") + `</dl></div>`;
  },
  autors: () => thead("Autoria", "Qui som", "Qui hi ha darrere d’aquesta web, amb quins interessos i com contactar-hi.") +
    `<div class="blocks">` + sec("Els autors", `<p>Som ${INFO.autors.map(esc).join(" i ")}, estudiants de 2n del grau en Ciències de l’Activitat Física i de l’Esport al TecnoCampus (centre adscrit a la Universitat Pompeu Fabra). Hem creat aquesta web com a treball grupal de l’assignatura Pedagogia i principis didàctics de l’AFE.</p>`) +
    `<div class="pfs">${PERFILS.map(p => `<article class="pf" style="--c:${p.c}"><div class="top">${p.foto ? `<img src="${esc(p.foto)}" alt="Foto de ${esc(p.nom)}">` : `<div class="av">${AVATAR(...p.av)}</div>`}<div><h3>${esc(p.nom)}</h3><p class="rm">Estudiant de 2n de CAFE · TecnoCampus</p><p class="ml"><a href="mailto:${esc(p.mail)}">${esc(p.mail)}</a></p></div></div><div class="body"><span class="bd">${esc(p.badge)}</span><p class="sp">${esc(p.esp)}</p><p class="tx">${esc(p.text)}</p><ul class="tg">${p.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div></article>`).join("")}</div><p class="note">Els perfils professionals descriuen cap a on volem orientar la nostra carrera; no són càrrecs actuals.</p>` +
    sec("Contacte", `<p>Pots escriure’ns per comentar els continguts, avisar d’un error o d’un enllaç trencat:</p><ul>${PERFILS.map(p => `<li>${esc(p.nom)}: <a href="mailto:${esc(p.mail)}">${esc(p.mail)}</a></li>`).join("")}</ul>`) +
    sec("Relació amb altres organitzacions", "<p>Els continguts provenen de les presentacions i els documents de l’assignatura del TecnoCampus, centre universitari adscrit a la Universitat Pompeu Fabra.</p>") +
    sec("Interessos i finançament", "<p>És un projecte acadèmic sense afany de lucre. No inclou publicitat ni rep finançament de cap entitat.</p>") +
    sec("Objectiu i objectivitat", "<p>La web presenta els continguts del curs com a alternativa a l’aprenentatge clàssic. Resumeix els materials de l’assignatura i en cita les fonts a la bibliografia.</p>") + `</div>`,
  ajuda: () => thead("Com funciona", "Ajuda", "Com treure partit a aquesta web.") + `<div class="blocks">` +
    sec("Navegar", "<p>Tria un tema al menú, agrupat per mòduls, o des de les targetes de l’Inici. Al final de cada tema pots anar a l’anterior o al següent. Al mòbil, el menú és a la part superior.</p>") +
    sec("Cercar", "<p>Escriu al cercador del menú: es filtren els temes que contenen aquella paraula als títols, als textos, a les taules o als conceptes clau.</p>") +
    sec("Esquemes i eines", "<p>Molts temes comencen amb un esquema. Alguns són interactius: al tema de classificacions pots triar una tasca i veure com es classifica, i al de regular la dificultat pots canviar l’espai, els participants, el material i el temps.</p>") +
    sec("Estudiar", "<p>Toca les targetes de conceptes clau per veure’n la definició. En acabar un tema, marca’l com a estudiat i la barra del menú s’actualitzarà. El progrés es guarda al teu navegador.</p>") +
    sec("Posar-te a prova", "<p>A «Posa’t a prova» hi ha preguntes de tot el temari amb correcció immediata. Si falles, cada resposta t’enllaça amb el tema que convé repassar.</p>") +
    sec("Llegir millor", "<p>Pots canviar entre mode clar i fosc amb el botó del final del menú. Tota la web es pot fer servir amb el teclat.</p>") + `</div>`,
  bibliografia: () => thead("Fonts", "Bibliografia i webgrafia", "Fonts utilitzades en aquesta web.") + `<div class="blocks">` +
    sec("Materials del curs", `<ul>${MATERIALS.map(m => `<li>${esc(m)}</li>`).join("")}</ul>`) +
    sec("Bibliografia", `<ul>${BIBLIO.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`) +
    sec("Webgrafia i enllaços externs", `<ul>${ENLACES.map(e => `<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.titulo)}</a> <small>Consultat el ${esc(e.consulta)}</small></li>`).join("")}</ul>`) + `</div>`
};

function matches(t, q) {
  if (!q) return true;
  const x = [t.t, t.r, ...t.s.flat(), ...(t.k || []).flat(), ...(t.tb || []).flat()].join(" ").toLowerCase();
  return x.includes(q.toLowerCase());
}

function renderNav() {
  const q = $("#q").value.trim(), l = TEMAS.filter(t => matches(t, q));
  const mods = MODULS.map(([id, n]) => { const ts = l.filter(t => t.m === id); return ts.length ? `<div class="mh" style="${sty(id)}">${esc(n)}</div>` + ts.map(btn).join("") : ""; }).join("");
  $("#nav").innerHTML = pagBtns("inici", "repte") + '<div class="sep"></div>' + (l.length ? mods : "<p>Cap resultat.</p>") + '<div class="sep"></div>' + pagBtns("glossari", "autors", "ajuda", "bibliografia");
  const n = TEMAS.filter(t => done[t.id]).length;
  $("#pb").style.width = (n / TEMAS.length * 100) + "%";
  $("#pt").textContent = `${n} de ${TEMAS.length} temes estudiats`;
}

function show(id, focus) {
  const m = $("#main");
  if (PAGS[id]) {
    current = id; m.style.cssText = sty(); m.innerHTML = PAGS[id]();
  } else {
    const t = TEMAS.find(x => x.id === id);
    if (!t) return show("inici", focus);
    current = t.id; m.style.cssText = sty(t.m);
    const same = TEMAS.filter(x => x.m === t.m), k = same.indexOf(t) + 1;
    const i = TEMAS.indexOf(t), pv = TEMAS[i - 1], nx = TEMAS[i + 1];
    m.innerHTML = thead(`${esc(MC[t.m].n)} · tema ${k} de ${same.length}`, esc(t.t), esc(t.r), t.m) +
      (DIAG[t.id] ? DIAG[t.id]() : "") + tbl(t.tb) +
      (() => { const ss = t.s.map(([h, p]) => `<section class="b"><h3>${esc(h)}</h3><p>${esc(p)}</p></section>`), sc = SCENES[t.id];
        return `<div class="blocks">` + (sc ? `<div class="pair">${ss[0]}${SC[sc]()}</div>` + ss.slice(1).join("") : ss.join("")) + `</div>`; })() +
      (t.k && t.k.length ? `<h3 class="kt">Conceptes clau</h3><div class="fcs">` + t.k.map(([a, b]) => `<button type="button" class="fc" aria-expanded="false"><b>${esc(a)}</b><span>${esc(b)}</span><small class="hint">Toca per veure la definició</small></button>`).join("") + `</div>` : "") +
      `<p style="margin-top:30px"><button type="button" class="btn" id="dn" aria-pressed="${!!done[t.id]}">${done[t.id] ? "Tema estudiat ✓" : "Marca com a estudiat"}</button></p>` +
      `<div class="pn">${pv ? `<button type="button" class="btn" data-go="${pv.id}">← ${esc(pv.t)}</button>` : ""}${nx ? `<button type="button" class="btn" data-go="${nx.id}">${esc(nx.t)} →</button>` : ""}</div>`;
  }
  if (location.hash !== "#" + current) history.replaceState(null, "", "#" + current);
  renderNav();
  if (focus) { m.focus({preventScroll: true}); scrollTo({top: 0}); }
}
const keep = f => { const y = scrollY; f(); show(current); scrollTo({top: y}); };

$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) show(b.dataset.id, true); });
$("#main").addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { show(g.dataset.go, true); return; }
  const lt = e.target.closest("[data-letter]");
  if (lt) { e.preventDefault(); const d = document.getElementById("g-" + lt.dataset.letter); if (d) d.scrollIntoView(); return; }
  const f = e.target.closest(".fc");
  if (f) f.setAttribute("aria-expanded", f.getAttribute("aria-expanded") !== "true");
  const tk = e.target.closest("[data-task]");
  if (tk) keep(() => { taskSel = +tk.dataset.task; });
  const vb = e.target.closest("[data-var]");
  if (vb) keep(() => { varSel[+vb.dataset.var] = +vb.dataset.val; });
  const o = e.target.closest(".opt");
  if (o && current === "repte") keep(() => { quizAns[+o.dataset.q] = +o.dataset.o; });
  if (e.target.closest("#qz-reset")) { quizAns = {}; show("repte"); }
  if (e.target.closest("#dn")) { done[current] = !done[current]; if (!done[current]) delete done[current]; save(); show(current); }
});
$("#q").addEventListener("input", renderNav);
const tbTxt = () => $("#tb").textContent = isDark() ? "Canvia a mode clar" : "Canvia a mode fosc";
$("#tb").addEventListener("click", () => {
  theme = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("ped-theme", theme); } catch (e) {}
  tbTxt();
});
addEventListener("hashchange", () => show(location.hash.slice(1), true));
tbTxt();
show(location.hash.slice(1) || "inici");
</script>
</body>
</html>
