<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedagogia i principis didàctics de l’AFE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepte: un pavelló esportiu. Menú com la banqueta (blau nit), pàgines com la pista: blau de pavelló, línies grogues i blanques. */
:root{
--paper:#F2F5F8;--card:#FFFFFF;--ink:#122033;--muted:#55657A;--line:#D6DEE7;--soft:#E8EEF4;
--court:#1D4F91;--court-ink:#FFFFFF;--stripe:#F5C518;--side:#0C2340;--side-ink:#EEF3F9;
--accent:#1D4F91;--good:#15803D;--bad:#B4234F;--c:#1D4F91;
--f-display:"Archivo","Arial Narrow",system-ui,sans-serif;--f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0B1520;--card:#122030;--ink:#E7EEF5;--muted:#9DB0C4;--line:#233548;--soft:#172A3D;--court:#1B4A88;--side:#06111C;--side-ink:#E7EEF5;--accent:#7FB0F0;--good:#4ADE80;--bad:#F472A0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B1520;--card:#122030;--ink:#E7EEF5;--muted:#9DB0C4;--line:#233548;--soft:#172A3D;--court:#1B4A88;--side:#06111C;--side-ink:#E7EEF5;--accent:#7FB0F0;--good:#4ADE80;--bad:#F472A0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--f-body);display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--stripe);color:#000;padding:8px 12px;z-index:9}

/* Banqueta (menú) */
aside{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;border-right:4px solid var(--stripe)}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
aside h1{font:800 19px/1.15 var(--f-display);font-stretch:112%;margin:0}
aside p{margin:0;font-size:13px;opacity:.7;line-height:1.4}
#q{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ffffff2e;background:#ffffff12;color:var(--side-ink);font:15px var(--f-body)}
#q::placeholder{color:#ffffff99}
.bar{height:6px;background:#ffffff1f;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--stripe);transition:width .4s}
.prog{font:600 12px var(--f-body);opacity:.8;margin-top:5px;letter-spacing:.02em}
nav{display:flex;flex-direction:column;gap:1px}
nav .mh{font:700 11px/1.3 var(--f-display);text-transform:uppercase;letter-spacing:.12em;margin:16px 8px 4px;display:flex;gap:8px;align-items:center;opacity:.75}
nav .mh::before{content:"";width:12px;height:4px;background:var(--c);border-radius:2px}
nav .sep{height:1px;background:#ffffff1f;margin:10px 0}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font:500 14.5px/1.3 var(--f-body);display:flex;gap:10px;align-items:flex-start}
nav button:hover{background:#ffffff14}
nav button[aria-current="true"]{background:#ffffff1f;box-shadow:inset 3px 0 0 var(--stripe);font-weight:700}
nav .tick{flex:none;width:14px;height:14px;border:2px solid #ffffff66;border-radius:3px;margin-top:2px}
nav .done .tick{background:var(--stripe);border-color:var(--stripe)}
nav button:focus-visible,.themebtn:focus-visible{outline:3px solid var(--stripe);outline-offset:2px}
.themebtn{all:unset;cursor:pointer;font:600 13px var(--f-body);opacity:.8;margin-top:auto;padding:6px 0}

/* Pista (contingut) */
main{padding-block:28px 80px;padding-left:max(16px,clamp(18px,4vw,52px));padding-right:max(16px,clamp(18px,4vw,52px));max-width:1040px;min-width:0}
main a{color:var(--accent)}
main small{color:var(--muted)}
:is(.btn,.fc,.opt,.lnk,.chip,.seg button,.mc,.tg-ex):focus-visible,main a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.court{position:relative;overflow:hidden;background:var(--court);color:var(--court-ink);border-radius:14px;padding:40px clamp(20px,4vw,44px) 36px;margin:0 0 26px}
.court svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.court > *:not(svg){position:relative}
.court .eyebrow{font:700 12px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--stripe)}
.court h2{font:900 clamp(32px,5.4vw,58px)/1 var(--f-display);font-stretch:118%;margin:10px 0 14px;max-width:13em;text-transform:uppercase}
.court p{font-size:clamp(16px,2vw,19px);margin:0;max-width:46ch;opacity:.92}
.score{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.score span{background:#00000038;border:1px solid #ffffff38;border-radius:6px;padding:6px 12px;font:600 13px var(--f-body)}
.score b{font:800 20px var(--f-display);color:var(--stripe);margin-right:6px;font-variant-numeric:tabular-nums}

/* Capçalera de tema: compacta */
.thead{border-bottom:4px solid var(--c);padding:6px 0 16px;margin:0 0 22px}
.thead .eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.thead .eyebrow i{width:10px;height:10px;background:var(--c);border-radius:2px}
.thead h2{font:800 clamp(28px,4vw,40px)/1.08 var(--f-display);font-stretch:108%;margin:8px 0 8px}
.thead p{margin:0;color:var(--muted);font-size:18px;max-width:60ch}

/* Mòduls a l'inici */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mc header{background:var(--c);color:#fff;padding:16px 18px 14px;position:relative;overflow:hidden}
.mc header svg{position:absolute;right:-18px;top:-18px;width:110px;height:110px;opacity:.28}
.mc .no{font:800 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.mc h3{font:800 22px/1.1 var(--f-display);margin:4px 0 0;color:#fff}
.mc p{margin:12px 18px 6px;font-size:15px;line-height:1.5;color:var(--muted)}
.mc ul{list-style:none;margin:0;padding:4px 10px 12px}
.mc li button{all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;padding:7px 8px;border-radius:6px;font:500 15px/1.35 var(--f-body)}
.mc li button:hover{background:var(--soft)}
.mc li button::before{content:"›";color:var(--c);font-weight:800;margin-right:8px}

/* Blocs de contingut */
.blocks{display:grid;gap:12px}
.b{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.b h3{font:700 19px/1.25 var(--f-display);margin:0 0 6px}
.b p,.b ul{margin:0 0 8px;max-width:72ch}
.b>:last-child{margin-bottom:0}
.b.lead-b{border-color:transparent;background:var(--soft)}
.kt{font:800 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 12px}
.fcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fc{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5;min-height:70px}
.fc b{font:700 16px var(--f-display);display:block}
.fc span{display:none;margin-top:4px;color:var(--muted)}
.fc .hint{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.fc[aria-expanded="true"] span{display:block}
.fc[aria-expanded="true"] .hint{display:none}
.empty{border:2px dashed var(--line);border-radius:10px;padding:24px;color:var(--muted)}

/* Taules */
.tw{overflow-x:auto;margin:0 0 18px;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:10px 14px;text-align:left;vertical-align:top}
tr:last-child>*{border-bottom:0}
thead th{background:var(--soft);font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid var(--c)}
tbody th{font-family:var(--f-display);font-weight:700}

/* Botons */
.btn{all:unset;cursor:pointer;font:700 15px var(--f-display);padding:10px 18px;border-radius:8px;border:2px solid var(--c);color:var(--ink)}
.btn:hover,.btn[aria-pressed="true"]{background:var(--c);color:#fff}
.pn{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
dl{margin:0}dt{font:700 17px var(--f-display);margin-top:14px}dd{margin:2px 0 0;max-width:70ch}
.az{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.az a{font:700 14px var(--f-display);text-decoration:none;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card)}

/* Esquemes */
.dg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:0 0 18px}
.dg>h3{font:800 12px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;gap:8px;align-items:center}
.dg>h3::before{content:"";width:14px;height:14px;border:3px solid var(--c);border-radius:50%}
.dg .cap{font-size:14px;color:var(--muted);margin:12px 0 0;max-width:70ch}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow .st{flex:1 1 150px;min-width:0;background:var(--soft);border-radius:8px;padding:12px 14px;border-top:4px solid var(--c)}
.flow .st b{font:800 16px/1.2 var(--f-display);display:block}
.flow .st small{display:block;font-size:13.5px;line-height:1.45;margin-top:4px}
.flow .ar{flex:none;align-self:center;font:800 22px var(--f-display);color:var(--c)}
.flow.cyc::after{content:"↻ el cicle torna a començar";flex-basis:100%;font:600 13px var(--f-body);color:var(--muted)}
.eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.eq span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:700 15px var(--f-display)}
.eq em{font:800 20px var(--f-display);font-style:normal;color:var(--c)}
.eq strong{background:var(--c);color:#fff;border-radius:8px;padding:8px 14px;font:800 15px var(--f-display)}
.nest{border:2px solid var(--c);border-radius:12px;padding:10px 12px 12px;font:700 14px var(--f-display)}
.nest .nest{margin-top:8px;border-style:dashed}
.nest .core{margin-top:8px;background:var(--c);color:#fff;border-radius:8px;padding:10px 12px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio>div{background:var(--soft);border-radius:10px;padding:14px;text-align:center}
.trio b{display:block;font:800 18px var(--f-display)}
.trio .q{display:block;font:700 13px var(--f-display);color:var(--c);letter-spacing:.06em;text-transform:uppercase;margin:2px 0 6px}
.trio small{display:block;font-size:13.5px;line-height:1.45}
.trio .mid{background:var(--c);color:#fff}
.trio .mid .q{color:#fff;opacity:.85}
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ctx span{font:600 13px var(--f-body);border:1px dashed var(--line);border-radius:999px;padding:4px 12px}
.spec{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.spec div{background:var(--soft);border-radius:8px;padding:10px;font-size:13px;line-height:1.4;border-bottom:4px solid var(--c)}
.spec b{display:block;font:800 14px var(--f-display);margin-bottom:2px}
.axis{display:flex;justify-content:space-between;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px;border-top:2px solid var(--line);padding-top:8px;gap:12px}
.stairs{display:flex;align-items:flex-end;gap:6px;height:190px}
.stairs div{flex:1;min-width:0;background:var(--c);color:#fff;border-radius:6px 6px 0 0;padding:6px;font:700 12.5px/1.2 var(--f-display);display:flex;align-items:flex-start;justify-content:center;text-align:center}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{background:var(--c);color:#fff;border-radius:8px;padding:10px 14px;text-align:center;font-size:13.5px;line-height:1.4}
.pyr b{display:block;font:800 16px var(--f-display)}
.pyr div:nth-child(1){width:55%;opacity:.75}.pyr div:nth-child(2){width:78%;opacity:.88}.pyr div:nth-child(3){width:100%}
.bars{display:grid;gap:10px}
.bars .row{display:grid;grid-template-columns:minmax(120px,230px) 1fr;gap:12px;align-items:center;font-size:14px}
.bars .tr{background:var(--soft);border-radius:4px;height:26px;position:relative}
.bars .tr i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:4px}
.bars .tr span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:800 13px var(--f-display);color:#fff;font-variant-numeric:tabular-nums}
.season{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.season div{background:var(--soft);border-radius:8px;padding:10px;font-size:13px;line-height:1.4}
.season b{display:block;font:800 14.5px var(--f-display)}
.season .lv{height:8px;border-radius:4px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.season .lv i{display:block;height:100%;background:var(--c)}
.hub{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.hub .ctr{background:var(--c);color:#fff;border-radius:50%;width:150px;height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 15px/1.2 var(--f-display);padding:14px;margin:auto}
.hub .col{display:grid;gap:8px}
.hub .col div{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.hub b{font:800 15px var(--f-display);display:block}
.hex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hex div{background:var(--soft);border-left:4px solid var(--c);border-radius:6px;padding:10px 12px;font:700 15px/1.3 var(--f-display)}
.hex small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* Eines interactives */
.tool{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.tg-ex{all:unset;cursor:pointer;font:600 14px var(--f-body);padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card)}
.chip[aria-pressed="true"],.tg-ex[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.axes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.axes div{background:var(--soft);border-radius:8px;padding:10px 12px}
.axes small{display:block;font:700 11.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.axes b{font:800 17px var(--f-display)}
.seg{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.seg>span{font:700 14px var(--f-display)}
.seg .o{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;cursor:pointer;font:500 14px var(--f-body);padding:6px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--card)}
.seg button[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.meter{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--good),var(--stripe),var(--bad))}
.meter i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .25s}
.mlab{display:flex;justify-content:space-between;font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.verdict{font:700 16px var(--f-display)}

/* Perfils */
.pfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin:0 0 14px}
.pf{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pf .top{background:var(--c);color:#fff;padding:20px;display:flex;gap:14px;align-items:center}
.pf img,.pf .av{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #ffffff80}
.pf .av{display:flex;align-items:center;justify-content:center;background:#ffffff26;font:800 28px var(--f-display)}
.pf h3{font:800 22px/1.1 var(--f-display);margin:0 0 4px;color:#fff}
.pf .rm{margin:0;font-size:14px;opacity:.9}
.pf .bd{display:inline-block;font:700 11.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pf .body{padding:16px 20px 20px}
.pf .sp{font:700 16px/1.3 var(--f-display);margin:2px 0 8px}
.pf .tx{font-size:15px;line-height:1.55;margin:0 0 12px}
.pf .tg{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.pf .tg li{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:500 13px var(--f-body)}
.note{font-size:14px;color:var(--muted)}
.pf .av svg{width:100%;height:100%;display:block}
.pf .ml{margin:4px 0 0;font-size:13.5px;overflow-wrap:anywhere}
.pf .ml a{color:#fff}
/* Il·lustracions */
.court.has-art{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:center}
.court .art{margin:0;align-self:end}
.court .art svg{width:100%;height:auto;display:block}
.mc header{min-height:92px;padding-right:96px}
.mc header svg{position:absolute;right:16px;top:50%;width:62px;height:62px;transform:translateY(-50%);opacity:.95}
.thead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.ticon{width:78px;height:78px;border-radius:12px;background:var(--c);padding:10px;margin-bottom:4px}
.ticon svg{width:100%;height:100%;display:block}
@media (max-width:860px){.court.has-art{grid-template-columns:minmax(0,1fr)}.court .art{max-width:360px;justify-self:center;width:100%}}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.scene{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.scene figcaption{font-size:13.5px;line-height:1.45;color:var(--muted);padding:10px 14px 12px}
@media (max-width:1000px){.pair{grid-template-columns:minmax(0,1fr)}.pair .scene{max-width:520px}}
@media (max-width:560px){.ticon{width:56px;height:56px;padding:7px}}

/* Quiz */
.qo{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.opt{all:unset;cursor:pointer;box-sizing:border-box;width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid var(--line);font:500 15.5px/1.4 var(--f-body)}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt[disabled]{cursor:default;opacity:.7}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);opacity:1}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);opacity:1}
.fbk{font-size:15px;margin-top:8px}
.lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font:inherit}

@media (max-width:860px){body{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;border-right:0;border-bottom:4px solid var(--stripe)}nav{max-height:300px;overflow-y:auto}
.spec,.season{grid-template-columns:repeat(2,minmax(0,1fr))}.axes{grid-template-columns:repeat(2,minmax(0,1fr))}.hex{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.trio{grid-template-columns:1fr}.hub{grid-template-columns:1fr}.flow .ar{transform:rotate(90deg);width:100%;text-align:center}.seg{grid-template-columns:1fr}.bars .row{grid-template-columns:1fr;gap:4px}.stairs{height:230px}.stairs div{font-size:11px}}
@media (prefers-reduced-motion:reduce){.bar i,.meter i{transition:none}}
</style>
</head>
<body>

const TEMAS = [
{id:"educacio-pedagogia-didactica", m:"fonaments", t:"Educació, pedagogia i didàctica", r:"Tres conceptes diferents i complementaris que vertebren la pràctica docent.",
 s:[["L’educació: el fenomen","Procés intencional, permanent i social que desenvolupa coneixements, habilitats, actituds, valors i competències en totes les dimensions de la persona: cognitiva, motriu, emocional, social i ètica. Es dona en contextos formals (escola, institut, universitat), no formals (clubs esportius, associacions, extraescolars) i informals (família, grup d’iguals, mitjans). Sarramona (2008) l’entén com una acció intencional de desenvolupament integral i socialització; Dewey (1916), com la reconstrucció contínua de l’experiència; Freire (1996), com una pràctica de llibertat; i la UNESCO (2021), com un bé comú."],
 ["La pedagogia: la ciència de l’educació","Disciplina científica que té l’educació com a objecte d’estudi: n’analitza les finalitats i els fonaments filosòfics, psicològics, socials i ètics (Friesen i Su, 2023). Dona el marc conceptual que justifica l’acció educativa i respon tres preguntes: per què eduquem?, quina finalitat perseguim? i quins valors promovem?"],
 ["La didàctica: la concreció de l’acció docent","Branca de la pedagogia que estudia l’ensenyament i l’aprenentatge i com les finalitats es converteixen en situacions reals d’aula (Ligozat, Klette i Almqvist, 2023). Es resumeix en quatre preguntes: què ensenyem (continguts i competències), com ho ensenyem (ABP, treball cooperatiu, ApS...), amb quins recursos i com sabem si han après (avaluació)."],
 ["Pedagogia i didàctica: la distinció clau","Les decisions pedagògiques fixen el per què i el per a què: model de ciutadania, valors del projecte educatiu, si es prioritza la inclusió, l’autonomia o el rendiment. Les didàctiques concreten el com: metodologies, recursos, espais i temps, activitats i avaluació formativa. Les decisions metodològiques només tenen sentit si responen a una concepció educativa (Zabala, 1995)."],
 ["Un exemple a l’Educació Física","Si el docent entén que l’EF ha de contribuir al desenvolupament integral (cooperació, autonomia, respecte, salut, inclusió i pensament crític), triarà models coherents: educació esportiva, gamificació, aprenentatge cooperatiu o responsabilitat personal i social. Si la finalitat fos el rendiment esportiu, optaria per metodologies més directives i repetició tècnica. La diferència no és l’activitat, sinó la finalitat que la justifica."],
 ["Competències docents","La competència pedagògica és comprendre finalitats, valors i fonaments i prendre decisions coherents amb un projecte educatiu. La competència didàctica és planificar, desenvolupar i avaluar l’ensenyament i l’aprenentatge. Un bon docent necessita totes dues."]],
 k:[["Educació","El fenomen: procés intencional, permanent i social de desenvolupament integral."],["Pedagogia","Ciència que estudia l’educació; respon al per què i al per a què."],["Didàctica","Concreció de l’acció docent; respon al com."],["Educació formal","Escola, institut o universitat, amb currículum estructurat."],["Educació no formal","Clubs, associacions i extraescolars: intencional però fora del sistema reglat."],["Educació informal","Família, iguals i mitjans: aprenentatge no planificat."]]},

{id:"introduccio-pensament-critic", m:"critic", t:"Introducció al pensament crític", r:"Ser crític no és el mateix que pensar críticament.",
 s:[["Autonomia i pensament crític (CCT5)","Capacitat de conèixer-se, gestionar accions i emocions, reflexionar críticament sobre la informació, aprendre de manera autònoma al llarg de la vida, prendre decisions responsables i qüestionar què s’aprèn i com s’aprèn."],
 ["Ser crític no és pensar críticament","Segons Sandy Ikeda, sovint es confon el pensament crític amb l’escepticisme. Davant algú que afirma una cosa amb què no estem d’acord, solem fer una de tres coses: deixar d’escoltar, encaixar l’afirmació al nostre sistema de creences o intentar «educar» l’altre. Cap d’aquestes respostes ens fa avançar, i totes atrofien el creixement intel·lectual."],
 ["Què implica pensar críticament","Qüestionar un sistema de creences, sobretot el propi, identificant les premisses que sostenen una afirmació i preguntant-se si les conclusions se’n deriven realment, si les premisses són raonables i si allò que jo considero raonable ho és de debò."]],
 k:[["Pensament crític","Qüestionar creences, començant per les pròpies, analitzant premisses i conclusions."],["Premissa","Idea de partida que sosté una afirmació o una conclusió."]]},

{id:"mini-guia-pensament-critic", m:"critic", t:"Mini-guia del pensament crític", r:"Conceptes i eines de Richard Paul i Linda Elder (Fundació per al Pensament Crític).",
 s:[["Per què pensament crític?","Gran part del nostre pensament és arbitrari, distorsionat o prejudiciat, i la qualitat de vida depèn de la qualitat del pensament. El pensament crític el millora en apoderar-se de les seves estructures i sotmetre-les a estàndards intel·lectuals."],
 ["Els 8 elements del pensament","Propòsit, pregunta en qüestió, informació, inferències i conclusions, conceptes, supòsits, implicacions i conseqüències, i punts de vista."],
 ["Estàndards intel·lectuals","Claredat, exactitud, precisió, rellevància, profunditat, amplitud i lògica. Cadascun es treballa amb una pregunta: pots posar un exemple?, com es pot verificar?, pots ser més específic?, quina relació té amb la pregunta?, atén la complexitat?, es consideren altres perspectives?, les idees es recolzen entre si?"],
 ["L’obstacle: el pensament egocèntric","Egocentrisme innat («és cert perquè ho crec»), sociocentrisme («és cert perquè ho creiem») i compliment de desitjos («és cert perquè vull creure-ho»). Superar-ho és el primer pas."],
 ["Les 8 virtuts intel·lectuals","Humilitat, enteresa, empatia, autonomia, integritat, imparcialitat, perseverança i confiança en la raó."],
 ["Tres tipus de preguntes","Dins d’un sistema: una resposta correcta (coneixement). Sense sistema: una opinió que no es pot avaluar. Sistemes múltiples: respostes millors o pitjors (judici)."],
 ["Sis etapes de desenvolupament","Irreflexiu, retat, principiant, practicant, avançat i mestre. El pensament crític no és un destí, sinó un hàbit que es construeix amb pràctica conscient: aplica estàndards, millora els elements, cultiva virtuts i repeteix."]],
 k:[["Egocentrisme","Acceptar les pròpies creences sense qüestionar-les."],["Sociocentrisme","Adoptar les creences del grup sense evidència."],["Estàndards intel·lectuals","Criteris (claredat, exactitud, lògica...) per avaluar el raonament."],["Humilitat intel·lectual","Reconèixer els límits del propi coneixement."]]},

{id:"pensament-critic-pedagogia-critica", m:"critic", t:"Pensament crític i pedagogia crítica", r:"Dues corrents que no s’oposen, sinó que es complementen (Ayuste i Trilla, 2024).",
 tb:[["","Pensament crític","Pedagogia crítica"],["Referent","John Dewey","Paulo Freire"],["Tradició","Racionalista, pragmatista i filosòfica","Marxista, teoria crítica i sociologia"],["Desenvolupa","Habilitats intel·lectuals per analitzar, argumentar i decidir","Consciència crítica davant les desigualtats i el poder"],["Es pregunta","Què és el pensament crític i com ensenyar-lo","Per a què ha de servir"],["Proposa","Estratègies, tècniques i instruments","L’educació com a eina de transformació social i justícia"]],
 s:[["Què tenen en comú","Volen persones que pensin amb autonomia i qüestionin la realitat; uneixen reflexió i acció (experiència en Dewey, praxi en Freire); comparteixen una concepció democràtica de l’educació; i rebutgen la memorització i la transmissió passiva."],
 ["La diferència principal","El pensament crític respon al què i al com: ensenyar a pensar correctament. La pedagogia crítica respon al per a què: identificar desigualtats i injustícies per poder-hi actuar."],
 ["Complementarietat","Una aporta les eines per aprendre a pensar críticament; l’altra dona sentit i finalitat a aquest pensament. Combinades, formen persones que analitzen la realitat amb rigor i es comprometen a transformar-la."],
 ["Una omissió compartida","Totes dues han prestat poca atenció a experiències europees anteriors: l’Escola Moderna de Francesc Ferrer i Guàrdia (racional, laica i igualitària) i l’Escola de Barbiana de Lorenzo Milani (educació crítica lligada a la justícia social)."]],
 k:[["Praxi","Unió de reflexió i acció per transformar la realitat (Freire)."],["Pedagogia crítica","Corrent que posa el pensament crític al servei de la justícia social."]]},

{id:"educacio-esportiva", m:"models", t:"Educació esportiva", r:"Model de Siedentop (1994) que proposa una experiència esportiva autèntica, completa i socialment significativa.",
 s:[["Origen i per què utilitzar-lo","Va néixer de la insatisfacció de Siedentop amb un esport ensenyat de manera incompleta i d’un grup de treball amb professorat de secundària. Encaixa amb el currículum per competències gràcies al treball per rols (social i cívica, aprendre a aprendre, iniciativa), augmenta la motivació i la participació i satisfà el professorat."],
 ["Tres objectius a llarg termini","Competència motora (participar en el joc amb habilitats i comprensió), cultura esportiva (entendre valors, regles i tradicions) i entusiasme (comprometre’s a protegir i promoure la cultura esportiva)."],
 ["Característiques essencials","Temporades de 12 a 20 sessions (pretemporada, competició regular i fase final), equips estables, competició formal, registre de dades, esdeveniment culminant i festivitat. El professor actua com a «arquitecte de la pràctica» i els elements són guies, no receptes."],
 ["Els rols","Tothom és jugador i, a més, assumeix una responsabilitat: entrenador, preparador físic, periodista, gestor de material, àrbitre, anotador... En dansa hi ha rols propis, com coreògraf o enginyer de so. Convé rotar els rols i explicar-los amb fulls de rol."],
 ["Dos models de temporada","Temporada de blocs: una sola modalitat a totes les sessions. Temporada integrada: diversos cicles de pràctica autònoma, habitual en atletisme o gimnàstica, o amb esports d’estructura comuna (invasió, pista dividida)."],
 ["Autonomia al llarg de la temporada","El professor dirigeix al principi, va delegant a la pretemporada autònoma, supervisa durant la competició regular i l’alumnat s’encarrega de presentacions i premsa a l’esdeveniment final."],
 ["Implementació, avaluació i consells","Equips heterogenis, fitxes d’equip i fulls de rol, calendari públic. Avaluació formativa i compartida: autoavaluació, coavaluació, diaris d’equip i reflexió final. Consells: comença petit, planifica bé, escolta l’alumnat i reflexiona sobre el model."]],
 k:[["Temporada","Unitat llarga d’entre 12 i 20 sessions amb tres fases."],["Rol","Responsabilitat organitzativa que assumeix cada alumne, a més de jugar."],["Festivitat","Rituals de l’esport (samarreta, cants, crits) que creen un entorn segur."],["Esdeveniment culminant","Finals, premis i celebració que tanquen la temporada."]]},

{id:"educacio-aventura", m:"models", t:"Model d’Educació d’Aventura (MEDA)", r:"Aprenentatge experiencial per a les activitats físiques en el medi natural (AFMN).",
 s:[["Per què i d’on ve","Les AFMN formen part del currículum d’EF a gairebé totes les comunitats autònomes i hi ha evidència de beneficis psicològics i acadèmics (Baena-Extremera, 2011, 2013, 2015). L’origen se situa cap al 1940 en Kurt Hahn, creador dels United World Colleges i de Gordonstoun. Es basa en l’aprenentatge experiencial (Dewey, 1938)."],
 ["Modalitats","Educació d’aventura a l’aire lliure, aprenentatge experiencial, aprenentatge d’aventura en línia, educació a l’aire lliure, pedagogia de l’aventura i circuits d’alta corda."],
 ["No negociables i passos previs","No negociables: aprenentatge experiencial, contacte amb la natura, activitats de repte i gestió de riscos. Cal una avaluació inicial del nivell (seguretat, materials, nusos, progressió) i metodologies que deixin triar el nivell de repte i promoguin la cooperació."],
 ["Fases (Baena-Extremera, 2011)","Pas 1: autoconeixement i confiança amb el material, amb activitats pràctiques de materials i grup. Pas 2: pràctica en situacions reals i pensaments finals amb avaluació global. Les fases es poden intercalar segons el grup."],
 ["Exemple: escalada a 1r d’ESO","Fase 1: els dos o tres suports, el con, el pont inquebrantable i l’enllaç a les nostres vides. Fase 2: recorregut tècnic, reptes en grup i resolució de problemes inesperats (la caiguda del suport, la cinta perduda, el nus)."],
 ["Sessió i avaluació","Part inicial (objectius i escalfament), principal (activitats amb autoreflexió) i final (tornada a la calma i reflexió en grup). Avaluació formativa en tres moments (inicial, contínua i final) amb rúbriques, llistes de comprovació, diari de reflexió i coavaluació."],
 ["La reflexió com a eix","MEDA busca alumnat competent motoralment, però també personal, emocional i socialment. La reflexió connecta l’experiència amb la vida real, i les emocions fixen l’aprenentatge amb més fermesa."]],
 k:[["AFMN","Activitats físiques en el medi natural."],["Aprenentatge experiencial","Aprenentatge que parteix de l’experiència i continua amb reflexió, debat i anàlisi."],["Gestió de riscos","Característica no negociable del model."]]},

{id:"respecte", m:"valors", t:"El respecte", r:"Respecte cap als companys, un mateix, els adversaris, l’entorn i el professorat.",
 s:[["Cap als companys","Acceptar la diversitat, reconèixer el valor de cada persona i competir de manera sana, sense menysprear els altres i acceptant la derrota."],
 ["Cap a un mateix","Autoconeixement del propi cos i autoestima basada en les capacitats reals; salut i benestar, amb exercici regular i prevenció de conductes de risc."],
 ["Cap als adversaris","Joc net (respectar regles i decisions de l’àrbitre), esportivitat (valorar l’esforç de l’altre) i empatia en situacions de competició."],
 ["Cap a l’entorn","Cura del material i de les instal·lacions, consciència ambiental i pràctiques sostenibles."],
 ["Cap al professorat i les normes","Obediència conscient (les normes tenen objectiu pedagògic i de seguretat), comunicació assertiva i diàleg constructiu."]],
 k:[["Esportivitat","Valorar l’esforç dels adversaris i evitar conductes antiesportives."],["Comunicació assertiva","Expressar opinions i inquietuds de manera respectuosa i constructiva."]]},

{id:"cooperacio", m:"valors", t:"Cooperació i treball en equip", r:"Competències clau per a l’esport col·lectiu i per formar joves col·laboratius.",
 s:[["Habilitats socials","Comunicació clara i respectuosa per coordinar-se, i empatia mitjançant jocs i dinàmiques col·laboratives."],
 ["Valoració de la diversitat","Reconèixer les habilitats de cadascú i dissenyar activitats on tothom pugui participar, sigui quina sigui la capacitat física."],
 ["Resolució de conflictes","Mediació i negociació: escoltar i buscar solucions col·lectives, i acceptar i adaptar-se als acords de l’equip."],
 ["Rols dins l’equip","Líder (guia i motiva), coordinador (organitza la comunicació) i executor (fa tasques concretes). Es promou la rotació de rols."],
 ["Pertinença i cohesió","Construir equip crea sentiment de pertinença, i celebrar els èxits compartits reforça que el treball conjunt val més que l’esforç individual."]],
 k:[["Líder","Guia i motiva l’equip cap als objectius comuns."],["Coordinador","Organitza i facilita la comunicació entre membres."],["Executor","Realitza tasques específiques per assolir els objectius."],["Cohesió de grup","Sentiment de pertinença que uneix l’equip."]]},

{id:"esforc", m:"valors", t:"Esforç i superació personal", r:"Valors centrals de l’EF a secundària per al creixement personal i acadèmic.",
 s:[["Cultura de l’esforç","Acceptar el repte amb actitud positiva i mostrar persistència per millorar habilitats amb la pràctica repetida."],
 ["Superació dels límits personals","Autoconeixement de capacitats i limitacions, fixació d’objectius realistes però ambiciosos i motivació intrínseca."],
 ["Afrontar el fracàs","Resiliència i adaptació (errors i dificultats formen part de l’aprenentatge) i feedback constructiu immediat de companys i professorat."],
 ["Esforç col·lectiu","Treball en equip, solidaritat per superar el desànim i un ambient cooperatiu que manté la motivació."],
 ["Fora de l’aula","Transferència a la vida acadèmica i personal, mentalitat de creixement i aprenentatge continuat."]],
 k:[["Resiliència","Aprendre dels errors i adaptar-se a les dificultats."],["Mentalitat de creixement","Creença que es pot millorar mitjançant l’esforç."],["Motivació intrínseca","Compromís amb els objectius de superació personal."]]},

{id:"autonomia", m:"valors", t:"Autonomia i responsabilitat", r:"Formen persones que prenen decisions informades i assumeixen les seves accions.",
 s:[["Autonomia personal","Autogestió de l’activitat (marcar objectius d’entrenament i gestionar el temps) i selecció d’activitats, que implica responsabilitzar-se de les pròpies eleccions."],
 ["Responsabilitats individuals","Gestionar l’esforç, adaptant ritme i límits, i complir les normes de seguretat i les regles dels jocs."],
 ["Autonomia en l’equip","Assumir un rol actiu al grup i prendre la iniciativa: organitzar jocs, liderar exercicis o proposar activitats."],
 ["Responsabilitat en l’aprenentatge","Autoavaluar el rendiment, reflexionar sobre el progrés, planificar i fer-ne seguiment."],
 ["Responsabilitat cap al propi cos","Cuidar la salut (dieta equilibrada, hidratació, descans, prevenció de lesions) i crear hàbits saludables que perdurin."]],
 k:[["Autogestió","Capacitat de decidir i organitzar les pròpies activitats."],["Autoavaluació","Valorar el propi rendiment i progrés."]]},

{id:"joc-net", m:"valors", t:"Joc net i justícia", r:"Principis per desenvolupar una actitud esportiva i respectuosa dins i fora de l’àmbit acadèmic.",
 tb:[["Criteri d’avaluació","Mètode de reconeixement"],["Respecte als companys i adversaris","Premi al millor company d’equip"],["Compliment consistent de les regles","Certificat de joc net"],["Resolució pacífica de conflictes","Reconeixement a la mediació efectiva"],["Suport i inclusió dels companys","Distinció per esperit esportiu"]],
 s:[["Què és el joc net","Competir amb honestedat i respecte, sense trampes ni avantatges deslleials. Va més enllà de complir regles: és respectar companys i adversaris. Exemple: jocs cooperatius on l’èxit depèn de la col·laboració."],
 ["Justícia en les activitats","Equitat en la competició (regles aplicades igual a tothom), inclusió i adaptació perquè tothom tingui les mateixes oportunitats, i resolució imparcial de conflictes amb mediació, empatia i solucions constructives."],
 ["Dins el currículum","Sessions d’educació en valors amb discussions i estudis de cas; el docent com a model; la manera d’afrontar competicions i conflictes influeix en com l’alumnat practica aquests valors."],
 ["Impacte personal","Ètica esportiva aplicable a altres àmbits, respecte a les normes i responsabilitat social com a ciutadans."]],
 k:[["Joc net","Competir amb honestedat i respecte, sense trampes."],["Equitat","Aplicar regles i condicions igual a tots els participants."]]},

{id:"igualtat-inclusio", m:"valors", t:"Igualtat i inclusió", r:"L’EF com a espai on tothom té les mateixes oportunitats de participar i beneficiar-se’n.",
 s:[["Igualtat de gènere","Garantir que nois i noies tinguin les mateixes oportunitats de participar i liderar, i desafiar els estereotips que influeixen en la participació i en la percepció de les habilitats."],
 ["Diversitat funcional","Adaptar les activitats perquè siguin accessibles a tothom, també a l’alumnat amb discapacitat, i oferir suport personalitzat."],
 ["Diversitat cultural i social","Integrar activitats de diverses cultures i fomentar la interacció i el treball en equip entre grups socials i culturals diferents."],
 ["Igualtat d’oportunitats","Disseny inclusiu que promogui la participació equitativa i protocols per prevenir i abordar qualsevol discriminació o exclusió."],
 ["Autoestima i confiança","Celebrar els èxits individuals i donar retroalimentació positiva perquè l’alumnat cregui en les seves habilitats."]],
 k:[["Disseny inclusiu","Activitats pensades perquè tothom hi participi de manera equitativa."],["Diversitat funcional","Diferències de capacitat que exigeixen adaptar l’activitat."]]}

const GEN = {id:"models-pedagogics", m:"models", t:"Models pedagògics: generalitats", r:"Sistemes de tècniques, estratègies i mitjans d’ensenyament que busquen un aprenentatge significatiu.",
 s:[["Què és un model pedagògic","Sistema que estableix tècniques, estratègies i mitjans d’ensenyament per aconseguir un aprenentatge significatiu, i que permet fixar criteris i seqüències d’avaluació. Tipus: tradicional, conductista, cognitivista, constructivista i conectivista."],
 ["Model tradicional","El més antic: centrat en el mestre, que transmet el coneixement de manera jeràrquica i n’és l’autoritat. L’alumnat és receptor passiu."],
 ["Model conductista","L’alumne també és passiu i el docent és el centre. S’aprèn amb entrenament, repetició, pràctica i exposició, i l’avaluació se centra en el resultat final, amb premis i recompenses."],
 ["Model cognitivista","No busca acumular coneixements, sinó el desenvolupament intel·lectual. Atén el procés i el producte, amb l’alumne com a protagonista i el docent com a suport; es resolen problemes amb raonament i imaginació."],
 ["Model constructivista","L’alumne és protagonista del seu aprenentatge i el docent orienta i planteja reptes i preguntes per resoldre problemes reals. Importen el treball col·laboratiu, els coneixements previs i el context."],
 ["Conectivisme (Siemens, 2004)","Evolució del constructivisme: el coneixement sorgeix de les connexions entre els nodes d’una xarxa. El docent té identitat digital professional i ajuda l’alumnat a construir el seu entorn personal d’aprenentatge (PLE): buscar i filtrar informació, organitzar continguts, comunicar-se, crear-ne i publicar-ne, i col·laborar."],
 ["Models pedagògics en l’Educació Física","Cooperatiu, educació esportiva, comprensiu, educació d’aventura, estil actitudinal, autoconstrucció de materials, gamificació, contracte didàctic, aprenentatge basat en problemes, aprenentatge servei i aprenentatge per projectes."]],
 k:[["Model pedagògic","Sistema de tècniques, estratègies i mitjans per aconseguir un aprenentatge significatiu."],["Conductisme","Aprenentatge per repetició i recompensa, centrat en el docent."],["Constructivisme","L’alumne construeix el coneixement amb reptes i problemes reals."],["Conectivisme","El coneixement neix de la connexió entre nodes d’una xarxa."],["PLE","Entorn personal d’aprenentatge que cada estudiant construeix."]]};

const NOUS = [
{id:"tasca-motriu", m:"tasca", t:"La tasca motriu", r:"Conjunt d’accions organitzades que un practicant ha de fer per assolir un objectiu motor.",
 s:[["Concepte","Conjunt d’accions concretes i organitzades prèviament que l’alumne o l’esportista ha de realitzar per assolir un objectiu motor específic. Famose (1981) la veu com una activitat que motiva accions motrius seguint criteris d’èxit precisos; Parlebas (1981), com un conjunt de condicions materials i obligacions que defineixen un objectiu; Sánchez Bañuelos (1986), com allò que defineix els continguts generals de la matèria. A la pràctica, és el joc, l’exercici o l’activitat que proposem a classe."],
 ["Els 4 elements estructurals","Objectiu (la fita concreta), condicions (entorn i limitacions d’espai, temps o material), instruccions (normes que guien l’execució) i operacions (moviments i accions tècniques i tàctiques que executa el practicant)."],
 ["Per què importa","És la cèl·lula bàsica de la programació: determina què aprèn l’alumnat, condiciona els continguts i la metodologia, i sobre ella s’estructuren les sessions, les unitats didàctiques i la programació. Ha de ser significativa: no només educa en l’àmbit motriu, també en el social i el conceptual."],
 ["Tipus segons l’objectiu pedagògic","D’aprenentatge o tècniques (adquirir un gest), de joc o tàctiques (entendre el joc i decidir) i condicionals (potenciar força, velocitat o resistència)."]],
 k:[["Tasca motriu","Joc, exercici o activitat amb un objectiu motor específic."],["Objectiu","Fita concreta que es busca assolir."],["Condicions","Entorn i limitacions d’espai, temps o material."],["Instruccions","Normes i regles que guien l’execució."],["Operacions","Accions tècniques i tàctiques que executa el practicant."]]},

{id:"classificacions-tasques", m:"tasca", t:"Classificacions de les tasques motrius", r:"Cada tasca es pot situar a totes les classificacions alhora.",
 tb:[["Autor","Criteri","Categories"],["Knapp (1963)","Participació cognitiva","Habituals / perceptives"],["Cratty (1982)","Participació corporal","Fines / globals"],["Singer (1986)","Control sobre l’acció","Regulació externa / autoregulació"],["Poulton (1957)","Control ambiental","Tancades / obertes"],["Delgado Noguera (1993)","Síntesi integradora","Mecanisme, factor, àrea, organització, execució i disseny"]],
 s:[["Knapp: habituals i perceptives","Habituals: la seqüència es coneix i s’automatitza (anar en bici, córrer, nedar). Perceptives: la seqüència és desconeguda i exigeix participació cognitiva (jocs i esports d’oposició)."],
 ["Cratty: fines i globals","Fines: treball manual de precisió (escriure, tir amb arc). Globals: el moviment implica tot el cos (desplaçaments, salts)."],
 ["Poulton: tancades i obertes","Tancades: entorn fix i predictible, importa l’execució tècnica (salt de trampolí, servei de tennis). Obertes: entorn canviant i imprevisible, cal adaptació tàctica constant (contraatac en bàsquet, surf). Els esports col·lectius són tasques obertes."],
 ["Singer: control sobre l’acció","Regulació externa (tasques obertes i perceptives, com els esports col·lectius), autoregulació (tancades i habituals, com la gimnàstica o l’atletisme) i regulació mixta (creuament de les classificacions de Poulton i Knapp)."],
 ["Delgado Noguera: la síntesi","Segons el mecanisme (perceptives, de decisió, d’execució), el factor (qualitativa, quantitativa, mixta), l’àrea (motriu, social, cognoscitiva), l’organització (individual, col·lectiva), l’execució (simultània, alternativa, consecutiva) i el disseny (autoproposta, disseny extern)."]],
 k:[["Tasca oberta","Entorn canviant i imprevisible que exigeix adaptació tàctica."],["Tasca tancada","Entorn fix i predictible; importa l’execució tècnica."],["Tasca habitual","Seqüència coneguda i automatitzada."],["Tasca perceptiva","Seqüència desconeguda que exigeix participació cognitiva."]]},

{id:"mecanismes-acte-motor", m:"tasca", t:"Mecanismes de l’acte motor", r:"Percepció, decisió i execució segons Marteniuk (1971); taula adaptada de Sánchez Bañuelos (1986).",
 tb:[["Mecanisme","Menor complexitat","Major complexitat"],["Percepció","Entorn habitual, tasca tancada, individu i objecte estàtics, pocs estímuls lents","Entorn perceptiu, tasca oberta, individu i objecte en moviment, molts estímuls ràpids i conflictius"],["Decisió","Poques decisions, propòsit únic, molt de temps, factors fixos, sense risc","Moltes decisions, propòsits múltiples, temps breu, factors variables, amb risc"],["Execució","Pocs grups musculars, moviment simple, poca exigència física","Molts grups musculars, estructura complexa, molta exigència de rapidesa, precisió i condició física"]],
 s:[["Percepció","Fem conscient un estímul. Depèn de la capacitat perceptiva, de l’entorn, del tipus i nivell d’estímul i del tipus de control. Factors pedagògics: pràctica, atenció selectiva i anticipació perceptiva."],
 ["Decisió","S’analitzen les dades percebudes i es tria una resposta. Depèn de la intel·ligència motriu, del nombre d’alternatives, del temps disponible, de la incertesa i del risc. El factor pedagògic és la «lògica motriu», amb conceptes de tàctica individual."],
 ["Execució","El gest observable, la tècnica final. Té aspectes quantitatius (condició física: resistència, força, velocitat, flexibilitat) i qualitatius (coordinació, agilitat, equilibri)."],
 ["Alerta didàctica","Sovint es practica gairebé només l’execució, tot i que la percepció i la decisió són més determinants, sobretot als esports col·lectius. A Primària interessa potenciar sobretot els dos primers mecanismes."]],
 k:[["Percepció","Fer conscient un estímul."],["Decisió","Analitzar les dades i triar una resposta motriu."],["Execució","El gest observable que resol la tasca."],["Lògica motriu","Capacitat d’elaborar i seleccionar respostes amb tàctica individual."]]},

{id:"dissenyar-tasques", m:"tasca", t:"Regular la dificultat i dissenyar tasques", r:"Quatre variables per adaptar la tasca i sis passos per dissenyar-la.",
 s:[["Variables per regular la dificultat","Mida de l’espai (reduir-lo accelera les decisions), nombre de participants (la superioritat numèrica, com al 3 contra 1, facilita l’èxit de l’atacant), mòbils i materials (el pes o la mida canvien el ritme) i temps limitat (augmenta la pressió cognitiva)."],
 ["Vuit principis metodològics","Individualització, socialització, progressió, participació activa, motivació, aprenentatge significatiu, varietat i transferència. La individualització vol dir conèixer característiques, edat i nivell (sociograma, proves motrius, observació); la socialització, potenciar la interacció entre l’alumnat."],
 ["Dissenyar una tasca, pas a pas","1. Establir els continguts. 2. Definir objectius clars, mesurables i assequibles. 3. Organitzar espai, agrupament i material. 4. Donar una consigna breu i un reglament senzill que afavoreixi la participació. 5. Preparar variants per simplificar o complicar. 6. Avaluar l’assoliment i donar feedback ràpid i positiu."],
 ["Idees clau","Tasca = objectiu + condicions + instruccions + operacions. Regular la dificultat és manipular espai, participants, material i temps. Un bon disseny és intencionat, progressiu i avaluable."]],
 k:[["Superioritat numèrica","Més atacants que defensors, com al 3 contra 1, que facilita l’èxit."],["Sociograma","Instrument per conèixer les relacions dins del grup."]]},

{id:"competencies-docents", m:"docent", t:"Competències del professorat d’EF", r:"Què significa ser un professor competent d’Educació Física.",
 s:[["Què és una competència professional","Un repertori de comportaments que resulta de combinar coneixements, procediments i actituds coordinats: saber fer i saber estar per actuar amb eficàcia en situacions professionals. El professor competent és el que sap fer bé la seva feina (Siedentop, 2001). La formació teòrica i psicopedagògica és imprescindible, però disposar de competències docents és absolutament indispensable (Blázquez, 2013)."],
 ["Les 6 competències per ensenyar EF (Sebastiani)","Motivar l’alumnat, planificar i programar reflexivament, exigir i avaluar amb criteri, gestionar la classe, facilitar els aprenentatges i educar en valors."],
 ["Competències generals (Sebastiani i Delgado, 2010)","Connecta i motiva l’alumnat; s’adapta i exigeix segons la capacitat de cadascú; s’implica a l’escola; transmet sensibilitat i il·lusió; planifica reflexivament; exigeix i s’exigeix; educa en actituds i valors; avalua amb criteris definits i adaptables; coneix el seu alumnat; aconsegueix que aprengui; crea un bon clima; orienta segons les possibilitats; aporta coneixements teòrics; informa de les possibilitats de l’entorn; investiga i innova amb recursos variats; i actua de manera exemplar."],
 ["Les 10 competències per gestionar la classe (Blázquez, 2013)","1 Dissenyar i preparar la classe. 2 Gestionar la progressió dels aprenentatges. 3 Fer un diagnòstic inicial. 4 Utilitzar mètodes adients. 5 Crear un clima de convivència i tolerància. 6 Organitzar el grup classe. 7 Utilitzar bé mitjans i recursos. 8 Comunicar-se bé. 9 Motivar per aprendre. 10 Regular i ajustar l’aprenentatge a partir dels errors."]],
 k:[["Competència professional","Combinació de coneixements, procediments i actituds per actuar amb eficàcia."],["Avaluació inicial","Diagnòstic previ per partir del que l’alumne ja sap."]]},

{id:"gestio-sessio", m:"docent", t:"La sessió d’Educació Física", r:"Del pla de classe als tres moments de la sessió (Blázquez, 2013).",
 s:[["Dissenyar i preparar la classe","La classe és l’espai i el temps on es decideixen tots els components previsibles de la gestió didàctica. El pla (fitxa de la sessió) ha de ser coherent amb el que entenem per EF, i convé compartir-lo amb l’alumnat. El model tradicional (escalfament, part principal, tornada a la calma) rep crítiques: poca avaluació contínua, predomini de valors fisiològics i cap avaluació diagnòstica."],
 ["Moment d’acollida","Comença quan el professor rep el grup. La calidesa de les paraules motiva; cal fer rutines integrades sense perdre massa temps, saber qui té alguna limitació, connectar amb la sessió anterior i explicar per què fem la classe."],
 ["Moment de desenvolupament","Primer, la posada en acció: activitats generals i jugades que activen els sistemes cardiovascular, respiratori i locomotor, amb jocs ja coneguts i diagnòstic inicial. Després, el desenvolupament de les tasques: pocs exercicis ben repetits, atenció a les pauses, participació màxima i una motivació que vingui del progrés. El professor d’EF no és un simple animador de temps lliure."],
 ["Moment final","Tornada a la calma si el treball ha estat intens (relaxació o estiraments), o xerrada de feedback. Convé una rutina: recollir el material, hàbits d’higiene i preguntes sobre què s’ha après i amb quines sensacions s’ha acabat."],
 ["Progressió i diagnòstic","Gestionar la progressió és seleccionar i seqüenciar activitats amb espai i temps adequats, i modificar intensitat, dificultat o diversitat. L’avaluació inicial connecta el que l’alumne ja sabia amb el que ha d’assolir, base de l’aprenentatge significatiu."]],
 k:[["Fitxa de la sessió","Pla dissenyat del que farem a classe."],["Moment d’acollida","Inici de la sessió: rebre el grup, informar i motivar."],["Progressió","Avançar seqüenciant tasques per assolir objectius i competències."]]},

{id:"clima-organitzacio", m:"docent", t:"Clima de classe i organització del grup", r:"Normes, rutines, conflictes i formes d’organitzar el grup classe.",
 tb:[["Organització","Característiques","Limitacions"],["Massiva","Tot el grup treballa alhora; el professor controla l’execució i detecta fàcilment encerts i errors","Limita les interaccions, no atén la diversitat ni l’autonomia"],["Grups petits","El grup gestiona la seva capacitat de treball; el professor és mediador","La quantitat de feina pot superar la qualitat"],["Circuits i estacions","L’alumne té autonomia i control sobre la feina","Difícil ajustar un temps igual a totes les estacions"],["Tallers","Treball autònom durant un cert temps","L’alumne ha de memoritzar la feina; pot sortir un resultat diferent del previst"],["Parelles","Treball autònom, dirigit o lliure; preval la qualitat sobre la quantitat","Sense limitacions destacades"],["Individual","Cada alumne al seu ritme i amb total autonomia","Difícil controlar la qualitat i la quantitat del treball"]],
 s:[["Crear i mantenir un clima positiu","Les normes, les rutines i el clima social asseguren un procés educatiu integral, flexible i dinàmic que faciliti la participació i els aprenentatges significatius de tothom. Un bon ambient prevé conflictes i crea condicions òptimes per autoregular-se. L’EF és ideal per a la socialització i la inclusió."],
 ["Conflictes a l’EF","Les sessions d’EF són l’espai amb més conflictes, perquè l’alumnat expressa amb més llibertat sentiments i actituds. Segons Hernández i Buscà (2016), el 63 % són faltes de respecte, el 15 % faltes d’organització i consens, el 12 % de tipus discriminatori a nivell cultural i el 10 % de no acceptació de les regles. Capllonch et al. (2014) assenyalen les discriminacions de gènere, d’habilitat motriu o de cultura."],
 ["Un cas: la roba esportiva","Quan un alumne oblida la roba, una resposta raonable és no castigar-lo sense fer classe: buscar-li una funció adaptada (observador actiu, àrbitre o ajudant de material) perquè segueixi aprenent, i que la propera vegada porti l’equipació."],
 ["Formes d’organitzar el grup","Conèixer les formes d’organització social del grup ajuda a l’èxit de la classe. Les interaccions professor-alumnes i alumnes-alumnes són difícils, però clau per a la convivència i la tolerància."]],
 k:[["Clima de classe","Ambient de normes, rutines i relacions que facilita aprendre i conviure."],["Organització massiva","Tot el grup treballa alhora amb el mateix."],["Circuits i estacions","Treball paral·lel o successiu amb autonomia de l’alumne."]]},

{id:"entrenador", m:"docent", t:"El professor i l’entrenador", r:"Quin tipus d’entrenador vols ser? Lideratge, orientació i relació amb l’equip.",
 s:[["Quin tipus d’entrenador vols ser?","Segons el lideratge: autoritari, participatiu o permissiu. Segons l’orientació: millorar els jugadors o només el rendiment. La pregunta val per a l’escola, el món federat, l’amateur o el professional."],
 ["Relació entrenador-jugador","Coneix personalment el jugador, respecta les diferències individuals, detecta i potencia els líders, fa reunions amb jugadors, capitans i equip, integra els nous i explica amb claredat els rols."],
 ["Comportament de l’entrenador","Estableix objectius, regula la convivència, promou la cultura del treball, estimula la identitat d’equip, planifica la cohesió, és un exemple que transmet valors, busca solució als conflictes i deixa el protagonisme a l’equip, amb una exigència educada."],
 ["Relació amb l’staff","Delega tasques i responsabilitats, assigna rols clars, els dona confiança davant dels jugadors i els valora públicament."],
 ["Comunicar, motivar i adaptar","Comunicar de manera comprensible i organitzada és clau per a l’èxit docent. Motivar és optimitzar les condicions: compromís motor, autonomia i millors oportunitats malgrat el temps limitat. Adaptar és ajustar l’ensenyament als errors i a les necessitats de l’alumnat. També cal utilitzar de manera variada materials i instal·lacions."]],
 k:[["Lideratge participatiu","Estil que comparteix decisions amb l’equip."],["Exigència educada","Exigir amb respecte i claredat."]]},

{id:"pedagogia-venenosa", m:"docent", t:"Pedagogia venenosa i currículum ocult", r:"Tres conceptes de Fernández-Balboa (2004) per analitzar críticament l’ensenyament.",
 s:[["Pedagogia venenosa","Utilitza l’abús físic o psicològic amb el pretext que és beneficiós. Les víctimes tenen poques alternatives de resistència, neguen les seves emocions i perden la personalitat, substituïda per paraules i accions imposades per l’autoritat. Es transmet de generació en generació (Miller, 1990)."],
 ["Consciència autoritària","Resultat d’un procés didàctic de recompensa i càstig que subordina l’individu amb por i culpa, fins que esdevé un doble de l’autoritat i perd la identitat (Fromm, 1993)."],
 ["Currículum ocult","Valors i aspectes que s’ensenyen amb normes i rutines, i també els que s’ometen de manera conscient o inconscient; per això és difícil de detectar. Afecta la manera de pensar, actuar i veure el món, i pot legitimar creences que beneficien els grups poderosos (Boler, 1999; Kirk, 1992; Apple, 1990)."],
 ["Quin docent vols ser?","Hernández Álvarez (2014) planteja quatre perfils: tècnic, pràctic, reproductor o crític. La pregunta de fons és si volem treballar de professors o entrenadors, o volem ser-ho: un docent crític reflexiona sobre la seva pràctica per no reproduir aquestes dinàmiques."],
 ["Per què importa","Segons Fernández-Balboa, aquestes pràctiques busquen l’obediència cega i el control de l’alumnat, van contra una formació humanista i democràtica, i poden reproduir-se quan l’alumnat es converteix en docent sense reflexió crítica."]],
 k:[["Pedagogia venenosa","Ensenyament que usa l’abús, la por o la culpa amb el pretext que és beneficiós."],["Consciència autoritària","Subordinació de la persona mitjançant recompensa i càstig."],["Currículum ocult","Valors que s’ensenyen o s’ometen sense que es vegin."]]}
];
const MODELS_NOUS = [
{id:"pedagogia-contracte", m:"models", t:"Pedagogia del contracte", r:"Un marc educatiu que transforma les relacions d’aprenentatge a través del compromís, la negociació i la responsabilitat compartida.",
 tb:[["Tipus de contracte","Finalitat"],["Didàctic","Realitzar aprenentatges cognitius o metodològics d’una matèria, en una classe i segons un programa imposat per la institució"],["D’èxit","Que l’alumnat tingui èxit durant tot el curs; amb objectius nombrosos i variats"],["De projecte","Organitzar un projecte pràctic que ajudi a aprendre i elaborar un projecte personal de formació lligat al futur"],["De resolució de conflicte","Trobar solucions a un problema actitudinal: canvi de comportament, definició del conflicte i de les seves causes"],["Institucional","Elaborar les normes de funcionament d’una comunitat (classe, cicle, centre), negociades amb alumnat, professorat, PAS i famílies"]],
 s:[["Definició i per què serveix","Un contracte és un document que organitza situacions d’aprenentatge o de comportament: les persones es comprometen, després d’una negociació, als acords assolits per aconseguir objectius cognitius, metodològics o de comportament. Ofereix una porta a l’èxit a l’alumnat atrapat en el fracàs escolar, manté la motivació per aprendre allò que en un marc habitual no es faria i canvia les relacions de poder a l’aula i al centre."],
 ["Quatre principis fonamentals","1. Consentiment mutu: totes les parts accepten participar lliurement. 2. Acceptació positiva: l’alumne és acceptat tal com és, sense judicis previs. 3. Negociació: tots els elements de l’aprenentatge supervisat es negocien conjuntament. 4. Compromís recíproc: cada part compleix el pactat amb responsabilitat."],
 ["Desenvolupament positiu i motivació","Ajuda l’alumnat a ser lliure: expressar idees i projectes, escollir, prendre decisions i accedir a nous coneixements. Pot pactar camins diferents per assolir els objectius, sense un únic camí per a tot el grup. Com a element de motivació, ha de satisfer tres necessitats: estímuls que provoquin curiositat, estructura i recolzament que donin seguretat, i reconeixement que reforci les relacions socials i l’autoestima."],
 ["Socialització i pedagogia diferenciada","Inicia l’alumnat en l’autonomia i la responsabilitat amb una metodologia semidirectiva basada en la resolució de conflictes, que afavoreix l’empatia, el diàleg i la reformulació de propostes. A més, trenca la uniformitat del model didàctic i permet diferenciar continguts i metodologies."],
 ["Ajut metodològic, psicopedagògic i projecte de vida","Ensenya a raonar: desenvolupa el pensament analític i sintètic, la flexibilitat, l’estructuració d’idees i l’expressió oral i escrita mitjançant la negociació i l’argumentació. Millora la relació alumne-professor, recupera l’autoestima de l’alumnat amb fracàs escolar arrelat i serveix per reflexionar sobre el projecte de vida i concretar projectes a mig termini."],
 ["Etapes per arribar al contracte","Elements previs (objectiu, tipus, context, si és oral o escrit i si l’equip docent pot fer-ne el seguiment), exploració (raons i expectatives), formulació (l’objectiu el formula l’alumnat i ha de ser realista, avaluable i atractiu) i negociació (metodologia, mitjans i avaluació)."],
 ["Què es negocia i quins compromisos hi ha","S’hi negocien l’organització de la metodologia, el tipus de producció final, els mitjans i ajuts, l’avaluació (qui, com, amb quins criteris, quan i on) i el termini i la difusió. Mètode: tothom proposa opcions, l’alumnat en tria una o diverses, i es planifica, s’actua i es verifica. El compromís recíproc varia segons la posició de cadascú, l’interès, l’esforç sostingut i la personalitat; es pot escriure i signar o no, però ningú no està per damunt de ningú."],
 ["Conclusió","No és una recepta única, sinó una filosofia que posa l’alumnat al centre del seu aprenentatge i fomenta l’autonomia, la responsabilitat i el diàleg entre totes les parts."]],
 k:[["Contracte","Document que recull els acords negociats per assolir objectius d’aprenentatge o de comportament."],["Consentiment mutu","Totes les parts accepten participar lliurement."],["Acceptació positiva","L’alumne és acceptat tal com és, sense judicis previs."],["Compromís recíproc","Cada part es compromet a complir allò pactat."],["Pedagogia diferenciada","Diferenciar continguts i metodologies trencant la uniformitat didàctica."]]},

{id:"autoconstruccio-materials", m:"models", t:"Autoconstrucció de materials", r:"Transformar materials d’ús habitual o de rebuig en materials didàctics d’Educació Física.",
 tb:[["Criteri d’avaluació (escala de Likert de 5 punts)","Què valora"],["Seguretat","Absència de perills derivats de la forma, el pes o la composició"],["Robustesa","Resistència i durabilitat del material elaborat"],["Utilitat","Adequació als objectius per als quals es va dissenyar"],["Adequació","Adaptació a les característiques dels usuaris"],["Estètica","Acabat acurat i atractiu visual del producte final"],["Laboriositat","Esforç i cura invertits en la construcció"]],
 s:[["Per què utilitzar-lo","Alguns currículums d’EF promouen els materials no convencionals. El Decret 82/2014 d’Educació Primària del Principat d’Astúries convida a explorar més enllà dels recursos específics de l’àrea i a reutilitzar materials d’ús habitual o de rebuig, cosa que afavoreix una major igualtat d’oportunitats, el reciclatge, la reutilització i la creativitat."],
 ["Elements a considerar","El professorat ha de conèixer tècniques bàsiques per transformar materials de rebuig en didàctics (Méndez-Giménez, 2013). L’adaptació personalitzada millora la competència, la motivació i el gaudi (Méndez-Giménez, Fernández-Río i Méndez-Alonso, 2015). Cal oferir opcions de disseny i fomentar la cerca d’informació i l’autonomia, cuidar l’estètica i la funcionalitat amb materials econòmics, i tenir els materials disponibles a classe i al pati, reparant-los quan calgui."],
 ["Exemples","Bitlles amb ampolles de plàstic reutilitzades amb sorra o aigua; pilotes de malabars amb globus farcits d’arròs, sorra o llegums; frisbees de cartró resistent; pals d’expressió corporal de tubs de cartró o paper de diari; dianes de cartró amb puntuacions; estels de bosses de plàstic, canyes i cordills; xanques de pots resistents; i jocs d’anelles amb ampolles com a objectiu."],
 ["Estructura de la sessió","Segons els interessos del professorat, les característiques de l’alumnat i la complexitat del material, es pot construir durant la sessió d’EF, en un projecte interdisciplinari o a casa. A classe, les aules ordinàries solen anar millor que el gimnàs. Seqüència: instruccions, construcció, revisió i pràctica; el docent revisa el material construït per garantir la seguretat."],
 ["Passos 1 i 2: planificació i elaboració","Planificació: el docent decideix on i com es construirà, informa de recursos, passos i criteris d’avaluació, i té en compte objectius, cost i seguretat. Elaboració en tres modalitats: a la classe d’EF (treball cooperatiu i habilitats socials), a casa (amb instruccions o videotutorials, per dedicar més temps a la pràctica) o de manera interdisciplinària (amb àrees com Ciutadania, Matemàtiques i Coneixement del Medi)."],
 ["Passos 3 i 4: comprovació i manteniment","Comprovació: garantir que el producte no presenti perills i donar instruccions clares sobre usos adequats i inadequats. Manteniment: si s’usa de manera continuada, revisar que conservi les propietats i reparar-lo abans de tornar-lo a utilitzar."],
 ["Avaluació dels materials","L’alumnat participa en processos d’autoavaluació i coavaluació amb una escala de Likert de cinc punts que valora les sis característiques de la taula. L’objectiu és conscienciar-lo d’elaborar materials segurs, resistents, útils i atractius."],
 ["Consideracions finals","Des d’una perspectiva constructivista, potencia la creativitat: els materials són una font d’idees per inventar jocs. Permet practicar activitat física d’una certa intensitat en espais reduïts, a l’escola i a casa; garanteix l’accés de tot l’alumnat amb cartró, brics o ampolles; afavoreix l’educació ambiental amb el reciclatge de residus, sobretot plàstics i PVC; i es pot difondre amb videotutorials, trobades escolars o competicions."]],
 k:[["Autoconstrucció","Transformar materials d’ús habitual o de rebuig en materials didàctics."],["Escala de Likert","Escala de cinc punts per valorar els materials construïts."],["Coavaluació","L’alumnat valora el treball dels companys."],["Videotutorial","Recurs per construir el material a casa seguint instruccions."]]}

{id:"aprenentatge-cooperatiu", m:"models", t:"Aprenentatge cooperatiu", r:"Aprendre amb, dels i gràcies als altres: professorat i alumnat com a coaprenents (Fernández-Río, 2014).",
 tb:[["Element essencial","Idea clau"],["Interdependència positiva","«Jo et necessito i tu em necessites»: tots hi guanyem, ningú hi perd"],["Responsabilitat individual","Cada membre és responsable d’una part del treball"],["Interacció promotora","Ens ajudem els uns als altres amb suport i estratègies"],["Processament grupal","Avaluem allò que fem i com funciona el grup"],["Habilitats interpersonals","Escoltar, respectar torns, resoldre conflictes i animar"],["Participació equitativa","Tothom té dret a participar; ningú és prescindible"],["Igualtat d’oportunitats d’èxit","Progressar respecte d’un mateix, no ser millor que els altres"]],
 s:[["Per què a l’Educació Física","Molts confonen l’EF amb l’esport competitiu, però es pot treballar colze a colze per a objectius comuns, on guanyar o perdre passa a un segon pla. La societat fomenta la competència però demana col·laboració, i l’EF hi aporta un element únic: la motricitat. Cal «cooperativitzar» les classes."],
 ["Quatre perspectives que el sostenen","Motivacional (l’èxit individual depèn del grup), cohesió social (confiança, respecte i ajuda mútua), cognitiva (compartir idees enriqueix els processos mentals) i del desenvolupament (la zona de desenvolupament proper de Vygotski: amb ajuda s’arriba més lluny)."],
 ["Cooperar no és només treballar en grup","La col·laboració no requereix un objectiu compartit; la cooperació sí. I el treball en grup no implica per si sol interdependència positiva ni participació equitativa."],
 ["Fase 1: creació i cohesió del grup","Imprescindible: sense cohesió no hi ha aprenentatge cooperatiu (Kagan, 2003; Pujolàs, 2008). Quatre subfases no estrictament lineals: presentació («el llançament del nom»), trencaglaç («embolic de colors»), confiança («jo t’agafo») i autoconeixement («guia’m», amb els ulls tapats)."],
 ["Fases 2 i 3: de tècniques simples a complexes","Cicle de l’aprenentatge cooperatiu (Fernández-Río, 2017). Fase 2, la cooperació com a contingut: resultat col·lectiu, joc cooperatiu, desafiament i canvi. Fase 3, la cooperació com a recurs: pensa-comparteix-actua, caps numerats junts, grups d’aprenentatge, puzle i invenció de jocs. Els grups base ideals són de 4 membres, estables i heterogenis. Un error freqüent és començar per les tècniques complexes."],
 ["La sessió i l’avaluació","Tres moments: inici (objectius motrius i de valors), durant (reforçar conductes cooperatives) i final (reflexió sobre el funcionament del grup). Si la metodologia és cooperativa, l’avaluació també: autoavaluació registrada, coavaluació intragrupal o intergrupal i heteroavaluació del docent."]],
 k:[["Interdependència positiva","L’èxit de cadascú depèn de l’èxit del grup."],["Processament grupal","Reflexió del grup sobre el seu propi funcionament."],["ZDP","Zona de desenvolupament proper: allò que s’assoleix amb l’ajuda dels altres (Vygotski)."],["Grup base","Grup estable i heterogeni de 4 membres."]]},

{id:"gamificacio", m:"models", t:"Gamificació", r:"Un model pedagògic emergent que utilitza elements del joc per desenvolupar continguts curriculars.",
 tb:[["Nivell (Werbach i Hunter, 2012)","Què inclou"],["Dinàmiques","Narrativa, emocions, progressió i relacions socials"],["Mecàniques","Recompenses, regles, competició, cooperació i feedback"],["Components","Avatars, emblemes, assoliments, missions, nivells, punts i taulers"]],
 s:[["Per què renovar l’EF","Part de la pràctica continua amb enfocaments del segle XX: predomini del rendiment, metodologies directives i avaluació sumativa (Tinning, 1996). Part de l’alumnat de secundària percep l’EF allunyada dels seus interessos (Ntoumanis, 2001), mentre l’EF hauria d’ajudar a reduir el sedentarisme (Gasol Foundation, 2019)."],
 ["Què és","Utilitzar elements i tècniques de disseny de jocs en contextos que no són jocs (Werbach i Hunter, 2012). Kapp (2012) hi afegeix mecàniques, estètica i pensament de joc per motivar i resoldre problemes. En educació és un model emergent que va més enllà de la simple diversió (Fernández-Río i Flores, 2019). El terme gamify neix als anys vuitanta i el seu ús modern es data el 2003."],
 ["Compte amb la pseudogamificació","Apareix quan l’experiència es redueix a activitats breus, competitivitat excessiva, recompenses i classificacions sense objectius didàctics clars (Pérez-Pueyo i Hortigüela-Alcalá, 2020). Cal evitar l’ús exclusiu de PET: punts, emblemes i taula."],
 ["Dues fases inseparables (Blázquez i Flores, 2020)","Fase didàctica, el nucli: anàlisi del grup, objectius exigents amb diferents nivells, continguts i avaluació formativa. Fase gamificada, l’embolcall motivacional: narrativa, equips, missions, reptes, recompenses i classificacions. La didàctica té prioritat: la finalitat és aprendre més i millor."],
 ["Elements clau de la fase gamificada","Narrativa lligada al currículum (Fortnite, Stranger Things, Star Wars); equips heterogenis de 4 amb perfils de jugador (recollidors, exploradors, assassins i socialitzadors) i avatars; missions i reptes progressius que equilibren dificultat i competència (teoria del flux, Csikszentmihalyi, 1990); i recompenses com punts, insígnies o diplomes."],
 ["Implementació i avaluació","Estètica i escenografia (Canva, Piktochart), escuts i avatars de grup, taulers i mapes, comunicació contínua (Moodle, blogs, ClassDojo) i control de la competitivitat, sense exposar classificacions. Avaluació formativa gairebé a totes les sessions, amb autoavaluació, coavaluació i heteroavaluació, rúbriques i portafolis."],
 ["Recomanacions","Forma’t abans d’aplicar-la, juga a molts jocs, comença amb microgamificacions (sales d’escapament, adaptacions de jocs de taula), adapta narratives publicades i dona retroalimentació constant sense sobredesenvolupar la motivació extrínseca."]],
 k:[["Gamificació","Ús d’elements de joc en contextos que no són jocs."],["Pseudogamificació","Gamificació reduïda a punts i classificacions sense objectius didàctics."],["PET","Punts, emblemes i taula: components que no s’han d’usar sols."],["Teoria del flux","Estat òptim quan la dificultat del repte s’equilibra amb la competència."],["Narrativa","Història atractiva lligada al currículum que embolcalla l’experiència."]]},

{id:"aprenentatge-servei", m:"models", t:"Aprenentatge-servei (ApS)", r:"Un model activista, reflexiu i experiencial que vincula l’aprenentatge curricular amb el servei a la comunitat.",
 tb:[["Modalitat","En què consisteix"],["Servei directe","L’alumnat i el col·lectiu receptor interactuen directament en tallers, xerrades o classes d’EF"],["Servei indirecte","Es creen recursos o programes d’activitat física per a col·lectius vulnerats, sense contacte directe"],["Recerca","Fer accessible informació d’EF (estils de vida saludables, nutrició) a qui no hi té accés"],["Denúncia","Campanyes de sensibilització sobre injustícies com el sexisme, la xenofòbia o la discriminació esportiva"],["eApS","Modalitat remota o semiremota amb videoconferències i entorns virtuals (Malvey et al., 2006)"]],
 s:[["Definició","Convida l’alumnat a descobrir, interpretar i transformar la realitat vinculant l’aprenentatge curricular amb el servei a la comunitat (Chiva-Bartoll, 2018). No és voluntariat ni pràctica comunitària aïllada: és la integració intencional i sinèrgica de currículum i servei. El lema: aprendre servint."],
 ["Fonaments","Aprenentatge experiencial (Dewey, 1938) i el cicle de Kolb (1984): experiència concreta, observació reflexiva, conceptualització abstracta i experimentació activa. Pensament reflexiu (Schön, 1987), aprenentatge transformatiu (Mezirow, 1978) i pedagogia crítica (Freire). El terme es fa servir des del 1967."],
 ["Quatre dimensions d’aprenentatge","Aprenentatges curriculars d’EF, desenvolupament de l’empatia, interpretació crítica de les injustícies socials i reconstrucció identitària amb nous valors i actituds (Butin, 2005; Chiva-Bartoll et al., 2020)."],
 ["Elements essencials","Connexió curricular sòlida, veu de la comunitat en totes les fases, reciprocitat entre agents, relació efectiva entre escola i societat, reflexió continuada i pensament crític i presa de decisions de l’alumnat."],
 ["Passos","1. Preparació i diagnòstic: interessos, capacitats i objectius vinculats al currículum. 2. Planificació i execució del servei amb la comunitat en contextos reals. 3. Avaluació, reconeixement i celebració pública del treball i de la transformació social generada."],
 ["Avaluació sistèmica","Model de De la Orden i Jornet (2012): eficàcia (portafolis, qüestionaris i rúbriques), eficiència (diaris de seguiment del procés) i funcionalitat (entrevistes i grups de discussió per veure si respon a les expectatives de la comunitat)."]],
 k:[["Aprendre servint","Lema de l’ApS: aprenentatge i servei units."],["Reciprocitat","Tots els agents implicats hi aporten i en reben alguna cosa."],["Cicle de Kolb","Experiència, observació reflexiva, conceptualització i experimentació activa."],["Servei indirecte","Crear recursos per a un col·lectiu sense contacte directe."]]},

{id:"valors-esport", m:"valors", t:"Els valors de l’esport", r:"Una perspectiva sociològica de Klaus Heinemann (Universitat d’Hamburg).",
 s:[["La tesi: l’esport no té valors","Segons Heinemann, l’esport, entès com una forma reglamentada de tractar el cos, no té valors en si mateix. Els valors són judicis subjectius que fan les persones a partir dels efectes que hi obtenen o que en esperen, o bé efectes que hi atribueixen institucions com clubs, gimnasos, l’Estat, les escoles o les empreses."],
 ["Què espera la gent de l’esport","Salut i condició física, benestar, diversió, vida social i integració, bellesa i confiança, i prestigi. Però són opinions agregades: no sempre sabem si responen a efectes reals, a desitjos o a missatges dels mitjans."],
 ["Els valors són variables","Depenen de qui practica i en quines condicions: no valora igual l’esport una persona gran que una de jove, qui va al gimnàs que qui és en un club, o un professional que un esportista de lleure. També canvien segons el país i l’època."],
 ["Quatre àmbits d’anàlisi","La persona, el mercat (valor econòmic), les institucions (sobretot els clubs) i l’Estat, que justifica l’«esport per a tothom» connectant-lo amb la salut, la joventut i la integració social."],
 ["Què en traiem a l’EF","Els valors no apareixen sols pel fet de fer esport: el docent els ha de treballar de manera intencionada. Per això els sis valors d’aquest mòdul necessiten estratègies concretes a la sessió."]],
 k:[["Atribució de valor","Judici que una persona o institució fa sobre l’esport."],["Esport per a tothom","Política que promou l’accés general a l’esport."]]},
